name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    # Fixed name: the develop and main rulesets require a check called "check"
    name: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build
        env:
          # Mock env vars for build (Firebase not needed for build verification)
          VITE_FIREBASE_API_KEY: mock-api-key
          VITE_FIREBASE_AUTH_DOMAIN: mock.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mock-project
          VITE_FIREBASE_STORAGE_BUCKET: mock.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: mock-app-id
